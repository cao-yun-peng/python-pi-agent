[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent-py"
version = "0.8.0"
description = "A teaching-first, modular Python agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "pi-agent contributors" },
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0", "jsonschema>=4.26,<5", "referencing>=0.37,<1"]
jsonschema = ["jsonschema>=4.26,<5", "referencing>=0.37,<1"]
otel = ["opentelemetry-sdk>=1.27,<2"]
dev = [
    "types-jsonschema==4.26.0.20261006",
    "mypy==1.19.1",
    "ruff==0.15.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_agent_py = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
modules = ["pi_agent_py.api", "pi_agent_py.domain", "pi_agent_py.ports", "pi_agent_py.tools.read", "pi_agent_py.tools.workspace", "pi_agent_py.tools.schema", "pi_agent_py.tools.mcp.contracts", "pi_agent_py.tools.mcp.tool", "pi_agent_py.tools.mcp.plugin", "pi_agent_py.tools.mcp.connection", "pi_agent_py.tools.mcp.sdk", "pi_agent_py.tools.mcp._logging", "pi_agent_py.tools.mcp._http", "pi_agent_py.application.capabilities.mcp"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
follow_imports = "silent"
