[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent-py"
version = "0.8.0"
description = "A teaching-first, modular Python agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "pi-agent contributors" },
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
redis = ["redis>=5,<9"]
eval = ["datasets>=3,<6", "swebench==5.0.2"]
mcp = ["mcp==2.3.0", "jsonschema>=4.26,<5", "referencing>=0.37,<1"]
jsonschema = ["jsonschema>=4.26,<5", "referencing>=0.37,<1"]
otel = ["opentelemetry-sdk>=1.27,<2"]
dev = [
    "types-jsonschema==4.26.0.20261006",
    "mypy==1.19.1",
    "ruff==0.15.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_agent_py = ["py.typed", "storage/migrations/*.sql"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
modules = ["pi_agent_py.runtime.recovery", "pi_agent_py.application.recovery", "pi_agent_py.context.compaction", "pi_agent_py.storage._writer", "pi_agent_py.observability._session_events", "pi_agent_py.runtime.execution_config", "pi_agent_py.runtime.execution_writer", "pi_agent_py.runtime.distributed_execution", "pi_agent_py.runtime.distributed_control", "pi_agent_py.runtime.tool_recovery", "pi_agent_py.providers.dispatch", "pi_agent_py.runtime.loop", "pi_agent_py.runtime.session", "pi_agent_py.runtime.compaction_orchestration", "pi_agent_py.application.builder", "pi_agent_py.application.runtime", "pi_agent_py.lease_clock", "pi_agent_py.testing_clock", "pi_agent_py.storage.lease", "pi_agent_py.storage.redis_lease", "pi_agent_py.runtime.lease_heartbeat", "pi_agent_py.storage.execution", "pi_agent_py.storage.execution_codec", "pi_agent_py.storage.execution_mutations", "pi_agent_py.storage._postgres_driver", "pi_agent_py.storage.postgres", "pi_agent_py.storage.postgres_migrations", "pi_agent_py.storage.postgres_cli", "pi_agent_py.storage._codec", "pi_agent_py.storage.jsonl", "pi_agent_py.execution_domain", "pi_agent_py.storage.execution_transitions", "pi_agent_py.application.evaluation.workflow", "pi_agent_py.application.evaluation.policy", "pi_agent_py.application.evaluation.cases", "pi_agent_py.application.evaluation.batch", "pi_agent_py.application.evaluation.grading", "pi_agent_py.application.evaluation.tasks", "pi_agent_py.application.evaluation.docker", "pi_agent_py.application.evaluation.runner", "pi_agent_py.application.evaluation.cli", "pi_agent_py.providers.recording", "pi_agent_py.storage.model_requests", "pi_agent_py.api", "pi_agent_py.domain", "pi_agent_py.ports", "pi_agent_py.runtime.session_spec", "pi_agent_py.runtime.components", "pi_agent_py.runtime.prompts", "pi_agent_py.application.prompts", "pi_agent_py.runtime.middleware", "pi_agent_py.providers.runtime", "pi_agent_py.tools.workspace.read", "pi_agent_py.tools.workspace.write", "pi_agent_py.tools.workspace.edit", "pi_agent_py.tools.workspace.ls", "pi_agent_py.tools.workspace.find", "pi_agent_py.tools.workspace.grep", "pi_agent_py.tools.workspace._file_ops", "pi_agent_py.tools.workspace._query_ops", "pi_agent_py.tools.workspace._mutation_tool", "pi_agent_py.tools.workspace._query_tool", "pi_agent_py.tools.sandbox", "pi_agent_py.tools.workspace.sandbox_backend", "pi_agent_py.tools.schema", "pi_agent_py.tools.mcp.contracts", "pi_agent_py.tools.mcp.tool", "pi_agent_py.tools.mcp.plugin", "pi_agent_py.tools.mcp.connection", "pi_agent_py.tools.mcp.sdk", "pi_agent_py.tools.mcp._logging", "pi_agent_py.tools.mcp._http", "pi_agent_py.application.capabilities.mcp"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
follow_imports = "silent"
