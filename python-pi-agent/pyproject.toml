[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-agent-py"
version = "0.1.0"
description = "A teaching-first, modular Python agent harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "pi-agent contributors" },
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_agent_py = ["py.typed"]
